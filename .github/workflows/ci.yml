name: CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: counterdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define Docker tags
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/flask-counter"
          IMAGE_NAME=$(echo $IMAGE_NAME | tr '[:upper:]' '[:lower:]')
          TAGS="${IMAGE_NAME}:${SHORT_SHA}"
          if [ "${{ github.ref_name }}" == "main" ]; then
            TAGS="${TAGS},${IMAGE_NAME}:latest"
          fi
          if git describe --tags --exact-match 2>/dev/null; then
            VERSION_TAG=$(git describe --tags --exact-match)
            VERSION_TAG=${VERSION_TAG#v}
            TAGS="${TAGS},${IMAGE_NAME}:${VERSION_TAG}"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run flake8 linter
        run: docker run --rm ${{ steps.meta.outputs.tags }} flake8 app/

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://postgres:secret@postgres:5432/counterdb
          REDIS_HOST: redis
          REDIS_PORT: 6379
        run: |
          docker run --rm --network container:${{ job.services.postgres.id }} \
            -e DATABASE_URL -e REDIS_HOST -e REDIS_PORT \
            ${{ steps.meta.outputs.tags }} pytest tests/